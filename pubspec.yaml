name: skolo_driver
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── USED ──────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.6              # font asset, used via CupertinoIcons
  shared_preferences: ^2.2.2          # USED — api/services/storage_service.dart
  flutter_secure_storage: ^9.0.0      # USED — storage_service, foreground_tracking_service
  geolocator: ^13.0.1                 # USED — helper/location_service, background_location_handler
  smooth_page_indicator: ^1.2.0+3     # USED — screens/auth_screen/onboarding_screen
  image_picker: ^1.1.2                # USED — document_update, user_details, onboarding, profile
  permission_handler: ^11.3.1         # USED — active_ride, pick_up_customer, drop_student screens
  flutter_rating_bar: ^4.0.1          # USED — completed_ride_details, ride_details_provider
  path_provider: ^2.1.4               # USED — completed_ride_details, ride_details_provider
  url_launcher: ^6.3.1                # USED — pending_ride, otp_verification, on_the_way
  open_file: ^3.5.9                   # USED — completed_ride_details, ride_details_provider
  gif: ^2.3.0                         # USED — pick_up_customer_screen
  shimmer: ^3.0.0                     # USED — widgets/skeletons/
  http: ^1.2.2                        # USED — api_client, onboarding_service, map_tile_layer
  avatar_glow: 2.0.2                  # USED — screens/auth_screen/auth_common_widgets
  emoji_picker_flutter: ^3.1.0        # USED — screens/app_pages/chat_screen
  flutter_map: ^6.1.0                 # USED — widgets/maps/map_widget, route_polylines, markers
  latlong2: ^0.9.1                    # USED — map_widget, optimized_route_model, trip_route_model
  socket_io_client: ^2.0.2+1          # USED — api/services/socket_service, background_location_handler
  flutter_background_service: ^5.0.5  # USED — helper/background_location_handler, foreground_tracking_service
  flutter_local_notifications: ^17.0.0 # USED — helper/foreground_tracking_service
  sqflite: ^2.3.2                     # USED — api/services/position_queue_service

  # ── NOT USED — remove after migration is complete ─────────────────────────
  provider: ^6.1.2                    # NOT USED — will be replaced by flutter_riverpod
  connectivity_plus: ^6.0.5           # NOT USED
  flutter_localization: ^0.2.0        # NOT USED — custom localization used instead (common/languages/)
  figma_squircle: ^0.6.3              # NOT USED
  flutter_svg: ^2.0.10+1              # NOT USED
  google_fonts: ^6.2.1                # NOT USED — custom fonts used instead
  pinput: ^5.0.0                      # NOT USED
  dotted_line: ^3.2.2                 # NOT USED
  google_maps_flutter: ^2.9.0         # NOT USED — flutter_map used instead
  geocoding: ^3.0.0                   # NOT USED
  location: ^7.0.1                    # NOT USED — geolocator used instead
  dropdown_search: ^6.0.1             # NOT USED
  cached_network_image:               # NOT USED
  dotted_border: ^2.1.0               # NOT USED
  timelines_plus: ^1.0.3              # NOT USED
  flutter_polyline_points: ^2.1.0     # NOT USED — flutter_map handles polylines natively
  flutter_cache_manager: ^3.4.1       # NOT USED

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/svg/auth/
    - assets/svg/settings/
    - assets/image/settings/
    - assets/image/
    - assets/image/auth/
    - assets/gif/
    - assets/flags/
    - assets/image/home/
    - assets/svg/home/
    - assets/svg/auth/logo.svg
    - assets/dummy_invoice.pdf
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: "assets/icon/logo.png"
  image_dark: "assets/icon/logo_dark.png"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
    image: "assets/icon/logo.png"
    image_dark: "assets/icon/logo_dark.png"
